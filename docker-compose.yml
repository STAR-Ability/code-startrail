name: codestartrail
services:
  web:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
    image: acm-training-agent:latest
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /app/storage/codestartrail.sqlite
      JUDGE_URL: http://judge:5050
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_ORIGIN: ${APP_ORIGIN:-}
    volumes:
      - training-data:/app/storage
    depends_on:
      judge:
        condition: service_healthy
    networks: [frontend, sandbox]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  judge:
    build:
      context: .
      dockerfile: judge/Dockerfile
      args:
        DEBIAN_IMAGE: ${DEBIAN_IMAGE:-debian:bookworm-slim}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
    image: codestartrail-judge:1.13.0
    # Namespace/cgroup controller; submitted programs run as sandbox UID 1000.
    # Deploy only on a dedicated demo host/VM. No host directories or Docker socket.
    privileged: true
    cgroup: private
    shm_size: 256m
    restart: unless-stopped
    networks: [sandbox]
    mem_limit: 1536m
    cpus: 2
    pids_limit: 256
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  frontend:
  sandbox:
    internal: true
volumes:
  training-data:
