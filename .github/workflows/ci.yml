name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check release PR source
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            echo '::error::Release PRs must come from dev or hotfix/* in this repository.'
            exit 1
          fi
          case "$HEAD_BRANCH" in
            dev|hotfix/*) ;;
            *) echo '::error::Merge ordinary changes into dev before opening a release PR to main.'; exit 1 ;;
          esac
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Demo V2 is being developed separately. Enable its existing sandbox
      # checks when that version's package.json is merged; V1 has no Judge.
      - name: Detect Judge integration
        id: judge
        run: node -e 'console.log("enabled=" + Boolean(require("./package.json").scripts["test:judge"]))' >> "$GITHUB_OUTPUT"
      - name: Prepare pinned execution sandbox
        if: steps.judge.outputs.enabled == 'true'
        run: |
          python3 scripts/download-judge.py amd64
          docker build -f judge/Dockerfile.offline -t codestartrail-judge:1.13.0 judge
          docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --no-build --wait judge
      - name: Test Judge integration
        if: steps.judge.outputs.enabled == 'true'
        run: npm run test:judge
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Sandbox logs
        if: failure() && steps.judge.outputs.enabled == 'true'
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml logs --tail 100 judge
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop test sandbox
        if: always() && steps.judge.outputs.enabled == 'true'
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml down
